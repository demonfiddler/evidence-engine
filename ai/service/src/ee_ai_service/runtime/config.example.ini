# Copy and customise this file to config.ini and edit the values as appropriate for your environment.
# DO NOT COMMIT your customised config.ini file to source control, as it contains sensitive information.

[ai]
ollama_url = http://localhost:11434
#api_key =
inference_model = llama3.1:8b
embedding_model = bge-large
existing_threshold = 0.82
discovered_threshold = 0.88

[ee]
ee_graphql_url = http://localhost:8080/api/graphql
rest_base_url = http://localhost:8080/api
username = user
password = secret

[misc]
# log_level = INFO | DEBUG | WARNING | ERROR | CRITICAL
log_level = INFO
