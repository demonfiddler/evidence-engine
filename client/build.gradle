plugins {
	id 'java'
	alias(libs.plugins.springBootPlugin)
}

dependencies {
	implementation project(':common')

	// Spring Boot platform
	implementation(platform(libs.springBootBom))

	// GraphQL client support
	implementation libs.springBootStarter
	implementation libs.springGraphql
	implementation libs.jacksonAnnotations
	implementation libs.jacksonCore
	implementation libs.jacksonDatabind
	implementation libs.bundles.graphqlJavaGeneratorClientRuntimeImpl
	implementation libs.graphqlJavaExtScalars

	// Utilities
	implementation libs.jsoup
	implementation libs.commonsCsv
	implementation libs.commonsCli

	// Dev tools
	// BEWARE: According to CoPilot, when running with WebApplicationType.NONE, devtools suppresses the stripping out
	// of the --spring.* command line arguments, so the whole command tail gets passed raw to CommandLineRunners.
	// developmentOnly libs.springBootDevTools

	// Testing
	testImplementation libs.junitPlatform
	testImplementation libs.springBootStarterTest
	testImplementation libs.springGraphqlTest
	testImplementation libs.springRestdocsWebtestClient
	testImplementation libs.springSecurityTest
	testImplementation libs.springWebflux
	testImplementation libs.truth
	testRuntimeOnly libs.junitPlatformLauncher
}

bootJar {
    enabled = true   // produce an executable Spring Boot JAR.
	archiveBaseName = 'ee-client'
    archiveVersion = '' // removes version from filename
	archiveClassifier = '' // removes classifier from filename
}

jar {
    enabled = false
}

tasks.assemble {
    dependsOn bootJar
}

ext {
	set('snippetsDir', file('build/generated-snippets'))
}

gradle.projectsEvaluated {
	tasks.named('test') {
		dependsOn project(':server').tasks.named('bootIntegrationTestServerBG')
		outputs.dir snippetsDir
		// useJUnitPlatform()
		if (project.hasProperty('caseInsensitive')) {
			println 'Case insensitive testing selected'
			systemProperty('ee.test.case-insensitive', true)
		}
		systemProperty('junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$OrderAnnotation')
		finalizedBy project(':server').tasks.named('terminateIntegrationTestServer')
	}
}
